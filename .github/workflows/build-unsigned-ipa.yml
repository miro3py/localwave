name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode and schemes
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcodebuild -list -project localwave.xcodeproj

      - name: Build unsigned .app from xcodeproj
        run: |
          set -euxo pipefail

          xcodebuild \
            -project localwave.xcodeproj \
            -scheme musicapp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      - name: Verify built app
        run: |
          set -euxo pipefail

          echo "Products:"
          find build/Build/Products -maxdepth 3 -print || true

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app produced in build/Build/Products/Release-iphoneos"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          mkdir -p unsigned-ipa/Payload
          cp -R "$APP_PATH" unsigned-ipa/Payload/
          cd unsigned-ipa
          zip -qry ../localwave-unsigned.ipa Payload

          test -f ../localwave-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Create draft release and upload IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          TAG="unsigned-ipa-${GITHUB_RUN_NUMBER}"
          TITLE="Unsigned IPA ${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            --draft \
            --title "$TITLE" \
            --notes "Unsigned IPA built from localwave.xcodeproj (scheme: musicapp) on commit ${GITHUB_SHA}" \
            localwave-unsigned.ipa
